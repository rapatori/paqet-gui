[package]
name = "paqet-gui"
version = "0.1.0"
description = "A lightweight Windows desktop client for paqet"
authors = ["paqet-gui contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.97.0"

[lib]
name = "paqet_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
process-test-support = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[[test]]
name = "process_supervision_windows"
path = "tests/process_supervision_windows.rs"
harness = false
required-features = ["process-test-support"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
