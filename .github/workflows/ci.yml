name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Windows application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Test frontend
        run: npm run test:run

      - name: Test sidecar staging
        run: npm run test:sidecar

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Test Windows process supervision
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features process-test-support --test process_supervision_windows

      - name: Test optimized process supervision
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features process-test-support --test process_supervision_windows

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features process-test-support -- -D warnings

      - name: Build Tauri application
        run: npm run tauri -- build --debug --no-bundle
